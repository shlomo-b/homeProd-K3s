# Every Friday at 09:00 (Chaos Mesh chart timezone: Asia/Jerusalem).
# For each pod-owner group with >= 2 running pods → kill ONE pod
# only if that pod has been Running >= 10 minutes.
# If only 1 pod, or all candidates younger than 10m → skip.
#
# Pick/skip logic is unchanged. The kill is a PodChaos (not kubectl delete)
# so Experiments in the UI lists the pods that were actually killed.
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: app-pod-kill
  namespace: chaos-mesh
spec:
  schedule: "0 9 * * 5"
  # Allow (recommended here): if a finished Workflow stays in status.active,
  # Forbid would block all future Fridays until you delete it by hand.
  # Our Task finishes in seconds → overlap risk is negligible.
  concurrencyPolicy: Allow
  historyLimit: 1
  type: Workflow
  workflow:
    entry: kill-one
    templates:
      - name: kill-one
        templateType: Task
        deadline: 5m
        task:
          container:
            name: kill
            # Portable image with shell + kubectl (not Bitnami, not k3s-specific)
            image: alpine/k8s:1.32.13
            imagePullPolicy: IfNotPresent
            command: ["/bin/sh", "-c"]
            args:
              - |
                # --- setup ---
                # MIN_AGE_SEC: pod must be live at least this many seconds (600 = 10 min)
                # NOW: current UTC time in epoch seconds (used to compute pod age)
                # TMP: temp dir for grouping pods by owner; deleted on exit

                MIN_AGE_SEC=600
                NOW=$(date -u +%s)
                TMP=$(mktemp -d)
                trap 'rm -rf "$TMP"' EXIT
                killed_seq=0

                # Keep only this Friday's PodChaos in the UI (same idea as historyLimit: 1)
                kubectl delete podchaos -n chaos-mesh -l app.kubernetes.io/name=app-pod-kill --wait=false 2>/dev/null || true

                # Alpine still picks the pod. Chaos Mesh performs the kill so Experiments can show it.
                apply_podchaos() {
                  _ns="$1"
                  _name="$2"
                  killed_seq=$((killed_seq + 1))
                  _safe=$(printf '%s' "$_name" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//' | cut -c1-36)
                  [ -z "$_safe" ] && _safe=pod
                  _pc="kill-${_safe}-$(date +%s)-${killed_seq}"
                  cat <<EOF | kubectl apply -f -
                apiVersion: chaos-mesh.org/v1alpha1
                kind: PodChaos
                metadata:
                  name: ${_pc}
                  namespace: chaos-mesh
                  labels:
                    app.kubernetes.io/name: app-pod-kill
                  annotations:
                    app-pod-kill/target: "${_ns}/${_name}"
                spec:
                  action: pod-kill
                  mode: one
                  duration: "1s"
                  selector:
                    namespaces:
                      - ${_ns}
                    pods:
                      ${_ns}:
                        - ${_name}
                EOF
                }

                # --- list all Running pods cluster-wide ---
                # Each line: namespace|podName|ownerKind|ownerName|startTime

                kubectl get pods -A --field-selector=status.phase=Running \
                  -o jsonpath='{range .items[*]}{.metadata.namespace}{"|"}{.metadata.name}{"|"}{.metadata.ownerReferences[0].kind}{"|"}{.metadata.ownerReferences[0].name}{"|"}{.status.startTime}{"\n"}{end}' \
                  > "$TMP/all.txt"

                # --- while #1: group pods by owner into one file per service ---
                # Skip pods with no owner. Write ns|name|startTime into TMP/<key>.pods

                while IFS='|' read -r ns name kind owner start; do
                  [ -z "$kind" ] && continue
                  key="${ns}|${kind}|${owner}"
                  f=$(printf '%s' "$key" | sed 's|/|__|g')
                  printf '%s|%s|%s\n' "$ns" "$name" "$start" >> "$TMP/$f.pods"
                done < "$TMP/all.txt"

                # --- for: one iteration per service group (each *.pods file) ---
                # Count replicas; if < 2 → SKIP; if >= 2 → try to kill one old enough pod

                for f in "$TMP"/*.pods; do
                  [ -f "$f" ] || continue
                  n=$(wc -l < "$f" | tr -d ' ')
                  first=$(head -1 "$f")
                  ns=$(printf '%s' "$first" | cut -d'|' -f1)
                  name=$(printf '%s' "$first" | cut -d'|' -f2)

                  # Only 1 Running pod for this owner → never kill (no HA)

                  if [ "$n" -lt 2 ]; then
                    echo "SKIP ${ns}/${name} (running=${n})"
                    continue
                  fi

                  # --- while #2: walk pods in this group; kill first with age >= 10m ---
                  # Convert startTime → epoch, age = NOW - start; PodChaos then break

                  killed=0
                  while IFS='|' read -r ns name start; do
                    s=$(printf '%s' "$start" | sed -E 's/\.[0-9]+Z$/Z/')
                    start_epoch=$(date -u -D '%Y-%m-%dT%H:%M:%SZ' -d "$s" +%s 2>/dev/null || echo 0)
                    age=$((NOW - start_epoch))
                    if [ "$start_epoch" -gt 0 ] && [ "$age" -ge "$MIN_AGE_SEC" ]; then
                      echo "KILL ${ns}/${name} (running=${n} age=${age}s)"
                      apply_podchaos "$ns" "$name" || true
                      killed=1
                      break
                    fi
                  done < "$f"

                  # Group had >= 2 pods but none were old enough yet → SKIP

                  if [ "$killed" -eq 0 ]; then
                    echo "SKIP ${ns}/${name} (running=${n} all_younger_than_${MIN_AGE_SEC}s)"
                  fi
                done
                echo "done"
