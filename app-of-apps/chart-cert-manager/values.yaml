serviceAccount:
  create: true

installCRDs: true

# Istio injects into every namespace (enableNamespacesByDefault). The apiserver
# calls this webhook from outside the mesh and checks the webhook certificate.
# A sidecar presents a SPIFFE cert with no DNS name, so the call fails with
# "certificate is not valid for any names". Opt out on the pod annotation.
#  podAnnotations for controller 
podAnnotations:
  sidecar.istio.io/inject: "false"

resources:
  limits:
    cpu: 100m
    memory: 512Mi

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node5

cainjector:
  enabled: true
  replicaCount: 1
  podAnnotations:
    sidecar.istio.io/inject: "false"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - node2

webhook:
  replicaCount: 1
  podAnnotations:
    sidecar.istio.io/inject: "false"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - node4

startupapicheck:
  enabled: true
  podAnnotations:
    sidecar.istio.io/inject: "false"
