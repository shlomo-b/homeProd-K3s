global:
  podLabels:
    idecar.istio.io/inject: "false"
serviceAccount:
  create: true

installCRDs: true  

resources:
  limits:
    cpu: 100m
    memory: 512Mi  

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node5

cainjector:
  enabled: true
  replicaCount: 1
  podLabels:
    idecar.istio.io/inject: "false"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - node2

webhook:
  replicaCount: 1
  podLabels:
    idecar.istio.io/inject: "false"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - node4

startupapicheck:
  enabled: true
  podLabels:
    idecar.istio.io/inject: "false"