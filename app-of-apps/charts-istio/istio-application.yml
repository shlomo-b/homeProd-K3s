apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio
  namespace: argocd
  labels:
    argocd.argoproj.io/instance: argocd
    app.kubernetes.io/managed-by: argocd
spec:
  project: platform-infra
  sources:
    - repoURL: https://github.com/shlomo-b/homeProd-K3s.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: base
      targetRevision: 1.31.0-rc.0
      helm:
        valueFiles:
          - $values/app-of-apps/charts-istio/values-istio-base.yaml
    # - repoURL: https://istio-release.storage.googleapis.com/charts
    #   chart: gateway
    #   targetRevision: 1.31.0-rc.0
    #   helm:
    #     valueFiles:
    #       - $values/app-of-apps/charts-istio/values-istio-gateway.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
