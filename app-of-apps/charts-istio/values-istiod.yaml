global:
  hub: registry.istio.io/release
  tag: 1.30.5
  proxy:
    autoInject: enabled
    # Resources for the sidecar.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 2000m
        memory: 1024Mi

# Native sidecars: required so Jobs can Complete when the main container exits.
# Istio 1.27+ only auto-enables this when ALL nodes are k8s >= 1.33.
# This cluster is k3s 1.32.x → traditional sidecars by default → Jobs stick (NotReady).
# Explicit opt-in is safe on k8s >= 1.29 (SidecarContainers feature).
pilot:
  env:
    ENABLE_NATIVE_SIDECARS: "true"

sidecarInjectorWebhook:
  enableNamespacesByDefault: true

cni:
  enabled: false

autoscaleEnabled: true
autoscaleMin: 2
autoscaleMax: 3

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - master
                - master2
                - master3

  # guarantee that all istiod pods are on different nodes
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app: istiod
        topologyKey: kubernetes.io/hostname