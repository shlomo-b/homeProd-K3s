# Required: Task pods use SA "default" in chaos-mesh.
# Same on GKE / EKS / AKS / k3s.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaos-mesh-app-pod-kill
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaos-mesh-app-pod-kill
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chaos-mesh-app-pod-kill
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ .Release.Namespace }}
