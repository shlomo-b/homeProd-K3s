replicaCount: 1
revisionHistoryLimit: 1
config:
  existingSecret: client-id

#  the email domains that are allowed to access the application
  emailDomains:
    - "*"

#  the upstreams that are allowed to access the application its the service name and the port
  upstreams:

    - http://hubble-ui.cilium-network-policy.svc.cluster.local:80
#  the provider that is used to authenticate the user
extraArgs:
  provider: entra-id
  oidc-issuer-url: "https://login.microsoftonline.com/a2724ae3-73eb-4b45-ba62-f432da279e2c/v2.0"
  redirect-url: "https://cilium-ui.spider-shlomo.com/oauth2/callback"
  scope: "openid profile email"
  oidc-email-claim: preferred_username

  reverse-proxy: "true"
  skip-provider-button: "true"
  code-challenge-method: S256

  cookie-secure: "true"
  cookie-httponly: "true"
  cookie-samesite: lax
  cookie-expire: 1h

  pass-basic-auth: "false"
  pass-access-token: "false"
  pass-authorization-header: "false"