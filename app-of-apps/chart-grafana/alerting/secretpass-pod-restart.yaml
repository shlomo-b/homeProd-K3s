# Grafana alerts: SecretPass pods → email (synced with live Grafana)
#
# Flap fix (one delete was sending 2 down + 2 up):
#   for: 1m            — must stay true 1m before first mail
#   keep_firing_for: 5m — ignore brief true→false→true metric gaps
#   group_interval: 5m
#   repeat_interval: 24h
#   resolve emails disabled
#
# Expected: delete ONE pod → 1 down mail + 1 up mail
#
# DOWN = pod existed 3m ago, missing now
# UP   = new pod vs 3m ago, and Ready
# RESTART = restart counter increased
#
# Live UIDs:
#   down:    cg0wi7tw4btvke
#   up:      fg0wu92e1qq68e
#   restart: fg0wh6jmakyyof
#   contact: eg0wha1gp1m9sb (secretpass-email)
#   folder:  cfaq9va8om2v4c (SecretPass)
#   prom:    P1809F7CD0C75ACF3
#
# Recipient: shlomobarzili@gmail.com

apiVersion: 1

contactPoints:
  - orgId: 1
    name: secretpass-email
    receivers:
      - uid: eg0wha1gp1m9sb
        type: email
        settings:
          addresses: shlomobarzili@gmail.com
          singleEmail: true
        disableResolveMessage: true

groups:
  - orgId: 1
    name: secretpass-pods
    folder: SecretPass
    folderUID: cfaq9va8om2v4c
    interval: 10s
    rules:
      - uid: cg0wi7tw4btvke
        title: SecretPass pod down
        condition: B
        for: 1m
        keep_firing_for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          namespace: secretpass
          event: down
        annotations:
          summary: SecretPass pod is down
          description: "Pod {{ $labels.pod }} disappeared from secretpass (deleted)."
        notification_settings:
          receiver: secretpass-email
          group_by:
            - alertname
            - pod
          group_wait: 0s
          group_interval: 5m
          repeat_interval: 24h
        data:
          - refId: A
            datasourceUid: P1809F7CD0C75ACF3
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: |
                sum by (pod) (
                  kube_pod_info{namespace="secretpass"} offset 3m
                  unless on(namespace, pod)
                    kube_pod_info{namespace="secretpass"}
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              intervalMs: 1000
              maxDataPoints: 43200

      - uid: fg0wu92e1qq68e
        title: SecretPass pod up
        condition: B
        for: 1m
        keep_firing_for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: info
          namespace: secretpass
          event: up
        annotations:
          summary: SecretPass pod is up
          description: "Pod {{ $labels.pod }} is Ready in secretpass (new pod after delete)."
        notification_settings:
          receiver: secretpass-email
          group_by:
            - alertname
            - pod
          group_wait: 0s
          group_interval: 5m
          repeat_interval: 24h
        data:
          - refId: A
            datasourceUid: P1809F7CD0C75ACF3
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: |
                sum by (pod) (
                  (
                    kube_pod_info{namespace="secretpass"}
                    unless on(namespace, pod)
                      kube_pod_info{namespace="secretpass"} offset 3m
                  )
                  and on(namespace, pod)
                  (
                    kube_pod_status_ready{namespace="secretpass", condition="true"} == 1
                  )
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              intervalMs: 1000
              maxDataPoints: 43200

      - uid: fg0wh6jmakyyof
        title: SecretPass pod restart
        condition: B
        for: 1m
        keep_firing_for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          namespace: secretpass
          event: restart
        annotations:
          summary: SecretPass pod restarted
          description: "Pod {{ $labels.pod }} in secretpass restarted (container restart count increased)."
        notification_settings:
          receiver: secretpass-email
          group_by:
            - alertname
            - pod
          group_wait: 0s
          group_interval: 5m
          repeat_interval: 24h
        data:
          - refId: A
            datasourceUid: P1809F7CD0C75ACF3
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: |
                sum by (pod) (
                  increase(kube_pod_container_status_restarts_total{namespace="secretpass"}[5m])
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              intervalMs: 1000
              maxDataPoints: 43200
