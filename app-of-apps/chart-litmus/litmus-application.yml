apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litmus-chaos
  namespace: argocd
  labels:
    argocd.argoproj.io/instance: argocd
    app.kubernetes.io/managed-by: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/shlomo-b/homeProd-K3s.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://litmuschaos.github.io/litmus-helm/
      chart: litmus
      targetRevision: 3.30.0
      helm:
        valueFiles:
          - $values/app-of-apps/chart-litmus/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: litmus
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      selfHeal: true
      prune: true
