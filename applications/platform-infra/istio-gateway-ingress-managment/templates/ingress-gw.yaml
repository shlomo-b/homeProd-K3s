apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: shared-gateway
  namespace: istio-ingress
spec:
  selector:
    istio: ingress-gateway
  servers:
    {{- range $name, $config := .Values.servers }}
    - port:
        number: 443
        name: https-{{ $name }}
        protocol: HTTPS
      hosts:
        - {{ $config.host | quote }}
      tls:
        mode: SIMPLE
        credentialName: {{ $config.tlsSecret | quote }}
    {{- end }}
