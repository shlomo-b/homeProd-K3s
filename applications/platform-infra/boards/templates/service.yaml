{{- if .Values.board.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name:   {{ include "yourchart.fullname" (dict "name" .Values.board.name) }}-svc
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.board.name }}
spec:
  selector:
    app:  {{ .Values.board.name }}
  ports:
    - name: {{ .Values.board.service.serviceName }}
      port: {{ .Values.board.service.port }}
      targetPort: {{ .Values.board.service.port }}
      protocol: TCP
  type: {{ .Values.board.service.serviceType }}
  
{{- end }}
