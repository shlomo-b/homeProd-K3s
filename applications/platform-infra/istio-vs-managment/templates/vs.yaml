{{- range $name, $vs := .Values }}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ $vs.name }}
  namespace: {{ $vs.namespace }}
spec:
  gateways:
    - {{ $vs.gateway | quote }}
  hosts:
    - {{ $vs.host | quote }}
  http:
    {{- range $http := $vs.http }}
    {{- with $http.match }}
    - match:
        {{- range $uri := .urls }}
        - uri:
            prefix: {{ $uri.prefix | quote }}
        {{- end }}
      route:
    {{- else }}
    - route:
    {{- end }}
        - destination:
            host: {{ $http.route.destination.host }}
            port:
              number: {{ $http.route.destination.port }}
    {{- end }}
{{- end }}