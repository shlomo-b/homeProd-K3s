istio-vs-secretpass:
  name: secretpass-vs
  namespace: secretpass
  host: secretpass.spider-shlomo.com
  gateway: istio-ingress/shared-gateway
  http:
    - match:
        urls:
          - prefix: /api/
          - prefix: /remote/saml/
      route:
        destination:
          host: backend-svc
          port: 5050

    - match:
        urls:
          - prefix: /
      route:
        destination:
          host: frontend-svc
          port: 3000