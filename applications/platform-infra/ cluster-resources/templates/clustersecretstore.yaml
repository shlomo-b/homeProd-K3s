{{- if .Values.clusterSecretStore.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.clusterSecretStore.name }}
spec:
  provider:
    aws:
      service: {{ .Values.clusterSecretStore.aws.service }}
      region: {{ .Values.clusterSecretStore.aws.region }}
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: {{ .Values.clusterSecretStore.aws.secretName }}
            key: {{ .Values.clusterSecretStore.aws.accessKeyIdKey }}
            namespace: {{ .Values.clusterSecretStore.aws.secretNamespace }}
          secretAccessKeySecretRef:
            name: {{ .Values.clusterSecretStore.aws.secretName }}
            key: {{ .Values.clusterSecretStore.aws.secretAccessKeyKey }}
            namespace: {{ .Values.clusterSecretStore.aws.secretNamespace }}
{{- end }}