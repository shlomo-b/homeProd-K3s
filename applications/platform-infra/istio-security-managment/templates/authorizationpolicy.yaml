
{{- range .Values.authorizationpolicies }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  {{- with .selector }}
  selector:
    matchLabels:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  action: {{ .action }}
  {{- with .rules }}
  rules:
    - from:
        - source:
            remoteIpBlocks:
              {{- toYaml .sourceRules | nindent 14 }}
  {{- end }}
{{- end }}
