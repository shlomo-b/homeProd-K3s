{{- range .Values.peerAuthentication }}
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  {{- with .selector }}
  selector:
    matchLabels:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  mtls:
    mode: {{ .mtls.mode }}
{{- end }}