peerAuthentication:
  - name: default
    namespace: istio-system
    mtls:
      mode: STRICT

  # - name: chaos-mesh-frontend
  #   namespace: chaos-mesh
  #   selector:
  #     app.kubernetes.io/name: chaos-mesh
  #     app.kubernetes.io/component: chaos-dashboard
  #   mtls:
  #     mode: PERMISSIVE


authorizationpolicies:
  - name: chaos-mesh-frontend-access-shlomo-and-vpn
    namespace: chaos-mesh
    selector:
      app.kubernetes.io/name: chaos-mesh
      app.kubernetes.io/component: chaos-dashboard
    action: ALLOW
    rules:
      sourceRules:
        - "10.0.11.250/32"
        - "10.212.212.1/32"

  - name: restrict-apps-by-ip-shlomo
    namespace: istio-ingress
    selector:
      istio: ingress-gateway
    action: ALLOW
    rules:
      sourceRules:
        - "10.0.11.250/32"
        - "10.212.212.1/32"
      to:
        hosts:
          - "cilium-ui.spider-shlomo.com"
          - "secretpass.spider-shlomo.com"
          - "grafana.spider-shlomo.com"      
          - "prometheus.spider-shlomo.com"
          - "pushgateway.spider-shlomo.com"
          - "apphub.spider-shlomo.com"
          - "hubble-ui.spider-shlomo.com"
          - "argocd.spider-shlomo.com"
          - "kiali.spider-shlomo.com"
          - "ipam.spider-shlomo.com"
          - "uptime-kuma.spider-shlomo.com"
          - "board.spider-shlomo.com"

  - name: mcp-server-master
    namespace: istio-ingress
    selector:
      istio: ingress-gateway
    action: ALLOW
    rules:
      sourceRules:
        - "10.42.0.122/32"
      to:
        hosts:
          - "grafana.spider-shlomo.com"