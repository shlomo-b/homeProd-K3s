peerAuthentication:
  - name: default
    namespace: istio-system
    mtls:
      mode: STRICT

  - name: litmus-frontend
    namespace: litmus
    selector:
      app.kubernetes.io/name: litmus
      app.kubernetes.io/component: litmus-frontend
    mtls:
      mode: PERMISSIVE


authorizationpolicies:
  - name: litmus-frontend-access-shlomo-and-vpn
    namespace: litmus
    selector:
      app.kubernetes.io/name: litmus
      app.kubernetes.io/component: litmus-frontend
    action: ALLOW
    rules:
      sourceRules:
        - "10.0.11.250/32"
        - "10.212.212.1/32"

  - name: restrict-apps-by-ip-shlomo
    namespace: istio-ingress
    selector:
      istio: ingress-gateway
    action: ALLOW
    rules:
      sourceRules:
        - "10.0.11.250/32"
        - "10.212.212.1/32"
      to:
        hosts:
          - "cilium-ui.spider-shlomo.com"
          - "secretpass.spider-shlomo.com"
          - "grafana.spider-shlomo.com"      
          - "prometheus.spider-shlomo.com"
          - "apphub.spider-shlomo.com"
          - "hubble-ui.spider-shlomo.com"
          - "argocd.spider-shlomo.com"
