          ports:
            - containerPort: {{ .Values.apphub.containerPort }}

          {{- with .Values.apphub.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.apphub.resources }}
          resources:
