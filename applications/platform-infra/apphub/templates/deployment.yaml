{{- if .Values.apphub.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yourchart.fullname" (dict "name" .Values.apphub.name) }}
  namespace: {{ .Values.namespace }}
  {{- with .Values.apphub.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app: {{ .Values.apphub.name }}
spec:
  revisionHistoryLimit: {{ .Values.apphub.revisionHistoryLimit }}
  {{- if not .Values.apphub.autoscaling.enabled }}
  replicas: {{ .Values.apphub.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.apphub.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.apphub.name }}
    spec:
      {{- with .Values.apphub.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.apphub.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: {{ .Values.apphub.name }}
          image: "{{ .Values.apphub.image.name }}:{{ .Values.apphub.image.tag }}"
          imagePullPolicy: {{ .Values.apphub.image.pullPolicy }}

          env:
{{- range $env := (.Values.apphub.env | default list) }}
            - name: {{ $env.name }}
{{- if $env.value }}
              value: {{ $env.value | quote }}
{{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ $env.secretName }}
                  key: {{ $env.key }}
{{- end }}
{{- end }}

