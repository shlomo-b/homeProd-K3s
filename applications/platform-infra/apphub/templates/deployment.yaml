{{- if $hasCm }}
            - configMapRef:
                name: config-{{ .Values.apphub.name }}
{{- end }}
{{- if $hasExtraSecret }}
                - secretRef:
                    name: {{ .Values.secret.name | default (printf "secretpass-config-%s" .Values.apphub.name) }}
