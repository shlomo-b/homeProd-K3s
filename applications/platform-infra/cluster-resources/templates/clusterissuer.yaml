{{- if .Values.clusterIssuer.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.clusterIssuer.name }}
spec:
  acme:
    email: {{ .Values.clusterIssuer.email }}
    server: {{ .Values.clusterIssuer.server }}
    privateKeySecretRef:
      name: {{ .Values.clusterIssuer.privateKeySecretName }}
    solvers:
      - dns01:
          route53:
            region: {{ .Values.clusterIssuer.route53.region }}
            accessKeyIDSecretRef:
              name: {{ .Values.clusterIssuer.route53.accessKeySecretName }}
              key: {{ .Values.clusterIssuer.route53.accessKeyIdKey }}
            secretAccessKeySecretRef:
              name: {{ .Values.clusterIssuer.route53.accessKeySecretName }}
              key: {{ .Values.clusterIssuer.route53.secretAccessKeyKey }}
{{- end }}