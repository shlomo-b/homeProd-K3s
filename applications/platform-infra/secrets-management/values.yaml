secretspass-credentials:
    external_secret_name: secretspass-credentials
    namespaces:
      - secretpass
    refreshInterval: 30m
    secretStoreRefName: aws-secret-store
    target: secretspass-credentials
    dataFrom:
      extract:
        key: secretspass-credentials

