appName: board
namespace: board


board:
  enabled: true
  revisionHistoryLimit: 0
#  replicas: 2
  name: board
  version: v1.0.0
  annotations:
    configmap.reloader.stakater.com/reload: "config-board"
    secret.reloader.stakater.com/reload: "board-credentials"

  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true  

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  service:
    enabled: true
    serviceName: http
    serviceType: ClusterIP
    port: 8093
  image:
    name: shlomobarzili/board
    pullPolicy: IfNotPresent
    tag: v1.0.0
  containerPort: 8093
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 50
    targetMemoryUtilizationPercentage: 70
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Percent
            value: 50
            periodSeconds: 15
      scaleDown:
        stabilizationWindowSeconds: 60
        policies:
          - type: Percent
            value: 50
            periodSeconds: 15
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - node1
                  - node2
    # keep board replicas on different nodes
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - board
          topologyKey: kubernetes.io/hostname   
  env:
    # # default is INFO
    # - name: LOG_LEVEL
    #   value: "INFO"
    - name: TZ
      value: "Asia/Jerusalem" 


    - name: BOARD_USER
      secretName: board-credentials
      key: BOARD_USER

    - name: BOARD_PASSWORD
      secretName: board-credentials
      key: BOARD_PASSWORD

    - name: MONGO_HOST
      secretName: board-credentials
      key: MONGO_HOST

    - name: MONGO_INITDB_ROOT_USERNAME
      secretName: board-credentials
      key: MONGO_INITDB_ROOT_USERNAME

    - name: MONGO_INITDB_ROOT_PASSWORD
      secretName: board-credentials
      key: MONGO_INITDB_ROOT_PASSWORD

    - name: MICROSOFT_ENTRA_IDENTIFIER
      secretName: board-credentials
      key: MICROSOFT_ENTRA_IDENTIFIER

    - name: SAML_LOGIN_URL
      secretName: board-credentials
      key: SAML_LOGIN_URL

    - name: SAML_CERTIFICATE
      secretName: board-credentials
      key: SAML_CERTIFICATE  

      
  # provider:
  #   aws:
  #     enabled: true
  #     secretName: secretspass-credentials
  #     credentials:
  #       aws_access_key_id: AWS_ACCESS_KEY_ID
  #       aws_secret_access_key: AWS_SECRET_ACCESS_KEY
  #       bucket_name: BUCKET_NAME
