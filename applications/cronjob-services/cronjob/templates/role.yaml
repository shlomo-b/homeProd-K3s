{{- range $name, $config := .Values }}
{{- if and $config.cronjob_name $config.rbac $config.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cronboard-read-schedule-{{ $config.cronjob_name }}
  namespace: {{ include "cronjob.namespace" $config }}
  labels:
    app: {{ $config.cronjob_name }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get"]
---
{{- end }}
{{- end }}
