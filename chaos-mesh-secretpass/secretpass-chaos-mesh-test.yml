apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-mesh-secretpass
  namespace: argocd
  labels:
    argocd.argoproj.io/instance: argocd
    app.kubernetes.io/managed-by: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shlomo-b/homeProd-K3s.git
    path: ./chaos-mesh-secretpass
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: " "
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
