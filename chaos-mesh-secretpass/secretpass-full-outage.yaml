# Every 15 minutes, any cluster (GKE / EKS / AKS / k3s):
# For each pod-owner group with >= 2 running pods → delete ONE pod.
# If only 1 pod → skip.
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: app-pod-kill
  namespace: chaos-mesh
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  historyLimit: 5
  type: Workflow
  workflow:
    entry: kill-one
    templates:
      - name: kill-one
        templateType: Task
        deadline: 5m
        task:
          container:
            name: kill
            # Portable image with shell + kubectl (not Bitnami, not k3s-specific)
            image: alpine/k8s:1.31.0
            imagePullPolicy: IfNotPresent
            command: ["/bin/sh", "-c"]
            args:
              - |
                # Group Running pods by owner (same ReplicaSet/STS/DS = same service).
                # Print: ACTION ns pod count
                # ACTION=KILL only when count >= 2; ACTION=SKIP when count == 1
                kubectl get pods -A --field-selector=status.phase=Running \
                  -o jsonpath='{range .items[*]}{.metadata.namespace}{"|"}{.metadata.name}{"|"}{.metadata.ownerReferences[0].kind}{"|"}{.metadata.ownerReferences[0].name}{"\n"}{end}' \
                | awk -F'|' '
                  $3 == "" { next }
                  {
                    key = $1 "|" $3 "|" $4
                    count[key]++
                    if (!(key in pod)) pod[key] = $2
                  }
                  END {
                    for (k in count) {
                      split(k, a, "|")
                      ns = a[1]
                      name = pod[k]
                      n = count[k]
                      if (n >= 2)
                        print "KILL", ns, name, n
                      else
                        print "SKIP", ns, name, n
                    }
                  }' \
                | while read -r action ns name n; do
                    echo "${action} ${ns}/${name} (running=${n})"
                    if [ "$action" = "KILL" ]; then
                      kubectl delete pod "$name" -n "$ns" --wait=false || true
                    fi
                  done
                echo "done"
